[tool.ruff]
line-length = 135
target-version = "py310"
extend-exclude = ["panel/static", ".venv", "state*", "backups"]

[tool.ruff.lint]
# Correctness first. Style churn across 30k working lines would add risk and no value.
select = ["E", "F", "W", "B"]
ignore = ["B008", "B027", "B905", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "B018", "B023"]

[tool.mypy]
python_version = "3.12"
files = ["mt5bot/core", "mt5bot/ports.py", "mt5bot/limits.py"]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["mt5bot", "panel"]
omit = ["mt5bot/advisor/*", "*/__main__.py"]
